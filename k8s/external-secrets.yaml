# External Secrets Configuration for SentiFinance
# This syncs secrets from Azure Key Vault to Kubernetes

---
# ServiceAccount with workload identity annotations
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentifinance-secrets-sa
  namespace: sentifinance
  annotations:
    azure.workload.identity/client-id: "146f1f78-e2b0-45d7-97a0-1844de98c132"
    azure.workload.identity/tenant-id: "246fd401-6008-4e0c-a6a2-71859a221ee2"
  labels:
    azure.workload.identity/use: "true"

---
# SecretStore pointing to Azure Key Vault
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault-store
  namespace: sentifinance
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://sentifinance-key-vault.vault.azure.net"
      serviceAccountRef:
        name: sentifinance-secrets-sa

---
# ExternalSecret that syncs from Key Vault to K8s Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sentifinance-external-secret
  namespace: sentifinance
spec:
  refreshInterval: 1h  # Refresh every hour
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  target:
    name: sentifinance-secrets  # This replaces your current secret
    creationPolicy: Owner
  data:
  - secretKey: secret-key
    remoteRef:
      key: secret-key
  - secretKey: jwt-secret-key
    remoteRef:
      key: jwt-secret-key
  - secretKey: database-uri
    remoteRef:
      key: database-uri
  - secretKey: gemini-api-key
    remoteRef:
      key: gemini-api-key
  - secretKey: gemini-api-key-sw
    remoteRef:
      key: gemini-api-key-sw
  - secretKey: openai-api-key
    remoteRef:
      key: openai-api-key
  - secretKey: mail-username
    remoteRef:
      key: mail-username
  - secretKey: mail-password
    remoteRef:
      key: mail-password
  - secretKey: azure-communication-connection-string
    remoteRef:
      key: azure-communication-connection-string
  - secretKey: azure-email-sender
    remoteRef:
      key: azure-email-sender
  - secretKey: azure-storage-connection-string
    remoteRef:
      key: azure-storage-connection-string
