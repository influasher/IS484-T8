apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Resources to deploy
resources:
  - namespace.yaml
  - configmap.yaml
  # secrets created via kubectl in CD workflow, not from file
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  # - ingress.yaml  # Uncomment if using custom domain

# Common labels applied to all resources
commonLabels:
  app: sentifinance
  version: v1.0.0
  environment: production

# Image transformations
images:
  - name: sentifinancetwo.azurecr.io/sentifinance-backend
    newTag: latest  # This will be updated by the CD pipeline

# Namespace for all resources (optional)
namespace: sentifinance