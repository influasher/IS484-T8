---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: portfolio-refresh
  namespace: sentifinance
  labels:
    app: portfolio-refresh
    component: batch-job
spec:
  # Schedule: Every day at 6 AM UTC (after market close)
  # Format: minute hour day-of-month month day-of-week
  # "0 6 * * *" = At 06:00 daily
  schedule: "0 6 * * *"

  # Timezone (optional, defaults to UTC)
  # timeZone: "Asia/Singapore"

  # Keep last 3 successful and 1 failed job for debugging
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  # Start deadline - if job doesn't start within 2 hours, skip it
  startingDeadlineSeconds: 7200

  # Concurrency policy - don't run multiple instances simultaneously
  concurrencyPolicy: Forbid

  jobTemplate:
    metadata:
      labels:
        app: portfolio-refresh
        component: batch-job
    spec:
      # Job will be marked as failed if not completed within 2 hours
      activeDeadlineSeconds: 7200

      # Retry failed jobs up to 1 time
      backoffLimit: 1

      # Clean up completed jobs after 1 day
      ttlSecondsAfterFinished: 86400

      template:
        metadata:
          labels:
            app: portfolio-refresh
            component: batch-job
          annotations:
            # ACI-specific annotations for spot instances and configuration
            virtual-kubelet.io/sku-name: "Standard"
            virtual-kubelet.io/burst-priority: "spot"
            virtual-kubelet.io/restart-policy: "Never"
        spec:
          restartPolicy: Never

          # Use service account with database access
          serviceAccountName: default

          # Deploy to Azure Container Instances (virtual node) for on-demand capacity
          nodeSelector:
            kubernetes.io/role: agent
            type: virtual-kubelet
            kubernetes.io/os: linux

          tolerations:
          - key: virtual-kubelet.io/provider
            operator: Exists
          - key: azure.com/aci
            effect: NoSchedule

          containers:
          - name: portfolio-refresh
            image: sentifinancetwo.azurecr.io/news-processor:latest
            imagePullPolicy: Always

            # Override the default command to run portfolio refresh job
            command: ["python"]
            args: ["/app/jobs/portfolio_refresh_job.py"]

            # Resource limits optimized for portfolio calculations
            # Lighter workload than news processing - mainly API calls and calculations
            resources:
              requests:
                memory: "1Gi"      # Lower memory requirement
                cpu: "500m"        # 0.5 vCPU
              limits:
                memory: "2Gi"      # Sufficient for price fetching and calculations
                cpu: "1000m"       # 1 vCPU max

            # Environment variables
            env:
            - name: JOB_TYPE
              value: "portfolio_refresh"

            - name: FLASK_ENV
              value: "production"

            # Logging configuration
            - name: LOG_LEVEL
              value: "INFO"

            - name: PYTHONUNBUFFERED
              value: "1"

            # Optional: Limit number of portfolios processed per run
            # Uncomment to enable throttling for testing
            # - name: MAX_PORTFOLIOS
            #   value: "100"

            # Database configuration (from secrets)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sentifinance-secrets
                  key: database-url

            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: sentifinance-secrets
                  key: db-host

            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: sentifinance-secrets
                  key: db-port

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: sentifinance-secrets
                  key: db-name

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: sentifinance-secrets
                  key: db-user

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentifinance-secrets
                  key: db-password

            # Additional configuration from ConfigMap
            envFrom:
            - configMapRef:
                name: sentifinance-config
                optional: true

            # Logging
            volumeMounts:
            - name: logs
              mountPath: /app/logs

          volumes:
          - name: logs
            emptyDir: {}

          # Image pull secret for ACR
          imagePullSecrets:
          - name: acr-secret

---
# Optional: Manual Job for testing portfolio refresh (run immediately)
apiVersion: batch/v1
kind: Job
metadata:
  name: portfolio-refresh-manual
  namespace: sentifinance
  labels:
    app: portfolio-refresh
    component: batch-job
    type: manual
spec:
  activeDeadlineSeconds: 7200
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400

  template:
    metadata:
      labels:
        app: portfolio-refresh
        component: batch-job
        type: manual
    spec:
      restartPolicy: Never
      serviceAccountName: default

      # Deploy to Azure Container Instances (virtual node) for on-demand capacity
      nodeSelector:
        kubernetes.io/role: agent
        type: virtual-kubelet

      tolerations:
      - key: virtual-kubelet.io/provider
        operator: Exists
      - key: azure.com/aci
        effect: NoSchedule

      containers:
      - name: portfolio-refresh
        image: sentifinancetwo.azurecr.io/news-processor:latest
        imagePullPolicy: Always

        # Override the default command to run portfolio refresh job
        command: ["python"]
        args: ["/app/jobs/portfolio_refresh_job.py"]

        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

        env:
        - name: JOB_TYPE
          value: "portfolio_refresh"
        - name: FLASK_ENV
          value: "production"
        - name: MAX_PORTFOLIOS
          value: "10"  # Limit for testing

        # Database configuration
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sentifinance-secrets
              key: database-url
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: sentifinance-secrets
              key: db-host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: sentifinance-secrets
              key: db-port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: sentifinance-secrets
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: sentifinance-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sentifinance-secrets
              key: db-password

        envFrom:
        - configMapRef:
            name: sentifinance-config
            optional: true

      imagePullSecrets:
      - name: acr-secret