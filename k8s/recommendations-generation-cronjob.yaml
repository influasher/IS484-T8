---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recommendations-generation
  namespace: sentifinance
  labels:
    app: recommendations-generation
    component: batch-job
spec:
  # Schedule: Every day at 8 AM UTC (after portfolio refresh and entity updates)
  # Format: minute hour day-of-month month day-of-week
  # "0 8 * * *" = At 08:00 daily
  schedule: "0 8 * * *"

  # Timezone (optional, defaults to UTC)
  # timeZone: "Asia/Singapore"

  # Keep last 3 successful and 1 failed job for debugging
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  # Start deadline - if job doesn't start within 1 hour, skip it
  startingDeadlineSeconds: 3600

  # Concurrency policy - don't run multiple instances simultaneously
  concurrencyPolicy: Forbid

  jobTemplate:
    metadata:
      labels:
        app: recommendations-generation
        component: batch-job
    spec:
      # Job will be marked as failed if not completed within 1.5 hours
      activeDeadlineSeconds: 5400

      # Retry failed jobs up to 1 time
      backoffLimit: 1

      # Clean up completed jobs after 1 day
      ttlSecondsAfterFinished: 86400

      template:
        metadata:
          labels:
            app: recommendations-generation
            component: batch-job
          annotations:
            # ACI-specific annotations for spot instances and configuration
            virtual-kubelet.io/sku-name: "Standard"
            virtual-kubelet.io/burst-priority: "spot"
            virtual-kubelet.io/restart-policy: "Never"
        spec:
          restartPolicy: Never

          # Use service account with database access
          serviceAccountName: default

          # Deploy to Azure Container Instances (virtual node) for on-demand capacity
          nodeSelector:
            kubernetes.io/role: agent
            type: virtual-kubelet
            kubernetes.io/os: linux

          tolerations:
          - key: virtual-kubelet.io/provider
            operator: Exists
          - key: azure.com/aci
            effect: NoSchedule

          containers:
          - name: recommendations-generation
            image: sentifinancetwo.azurecr.io/news-processor:latest
            imagePullPolicy: Always

            # Override the default command to run recommendations generation job
            command: ["python"]
            args: ["/app/jobs/recommendations_generation_job.py"]

            # Resource limits optimized for recommendation calculations
            # Light computational workload - mainly database queries and calculations
            resources:
              requests:
                memory: "1Gi"      # Light memory requirement
                cpu: "500m"        # 0.5 vCPU
              limits:
                memory: "2Gi"      # Sufficient for recommendations processing
                cpu: "1000m"       # 1 vCPU max

            # Environment variables
            env:
            - name: JOB_TYPE
              value: "recommendations_generation"

            - name: FLASK_ENV
              value: "production"

            # Logging configuration
            - name: LOG_LEVEL
              value: "INFO"

            - name: PYTHONUNBUFFERED
              value: "1"

            # Optional: Limit number of clients processed per run
            # Uncomment to enable throttling for testing
            # - name: MAX_CLIENTS
            #   value: "50"

            # Recommendation configuration
            - name: MAX_RECOMMENDATIONS_PER_CLIENT
              value: "10"

            - name: BATCH_SIZE
              value: "10"  # Process clients in batches

            # Portfolio health assessment configuration
            - name: INCLUDE_PORTFOLIO_HEALTH
              value: "true"

            - name: GENERATE_REPORTS
              value: "false"  # Set to true if you want to generate PDF reports

            # Database configuration (from secrets)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sentifinance-secrets
                  key: database-url

            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: sentifinance-secrets
                  key: db-host

            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: sentifinance-secrets
                  key: db-port

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: sentifinance-secrets
                  key: db-name

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: sentifinance-secrets
                  key: db-user

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentifinance-secrets
                  key: db-password

            # Additional configuration from ConfigMap
            envFrom:
            - configMapRef:
                name: sentifinance-config
                optional: true

            # Logging
            volumeMounts:
            - name: logs
              mountPath: /app/logs

          volumes:
          - name: logs
            emptyDir: {}

          # Image pull secret for ACR
          imagePullSecrets:
          - name: acr-secret

---
# Optional: Manual Job for testing recommendations generation (run immediately)
apiVersion: batch/v1
kind: Job
metadata:
  name: recommendations-generation-manual
  namespace: sentifinance
  labels:
    app: recommendations-generation
    component: batch-job
    type: manual
spec:
  activeDeadlineSeconds: 5400
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400

  template:
    metadata:
      labels:
        app: recommendations-generation
        component: batch-job
        type: manual
    spec:
      restartPolicy: Never
      serviceAccountName: default

      # Deploy to Azure Container Instances (virtual node) for on-demand capacity
      nodeSelector:
        kubernetes.io/role: agent
        type: virtual-kubelet

      tolerations:
      - key: virtual-kubelet.io/provider
        operator: Exists
      - key: azure.com/aci
        effect: NoSchedule

      containers:
      - name: recommendations-generation
        image: sentifinancetwo.azurecr.io/news-processor:latest
        imagePullPolicy: Always

        # Override the default command to run recommendations generation job
        command: ["python"]
        args: ["/app/jobs/recommendations_generation_job.py"]

        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

        env:
        - name: JOB_TYPE
          value: "recommendations_generation"
        - name: FLASK_ENV
          value: "production"
        - name: MAX_CLIENTS
          value: "5"  # Limit for testing
        - name: MAX_RECOMMENDATIONS_PER_CLIENT
          value: "5"
        - name: BATCH_SIZE
          value: "2"

        # Database configuration
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sentifinance-secrets
              key: database-url
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: sentifinance-secrets
              key: db-host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: sentifinance-secrets
              key: db-port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: sentifinance-secrets
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: sentifinance-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sentifinance-secrets
              key: db-password

        envFrom:
        - configMapRef:
            name: sentifinance-config
            optional: true

      imagePullSecrets:
      - name: acr-secret