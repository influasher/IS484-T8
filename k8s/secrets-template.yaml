# IMPORTANT: This is a template file for secrets
# DO NOT commit actual secrets to Git!
# Use this template to create secrets in your AKS cluster

# To create the secrets in your cluster, run:
# kubectl create secret generic sentifinance-secrets \
#   --from-literal=secret-key="$(openssl rand -hex 32)" \
#   --from-literal=database-uri="your-production-database-uri" \
#   --from-literal=jwt-secret-key="$(openssl rand -hex 32)" \
#   --from-literal=gemini-api-key="your-production-gemini-key" \
#   --from-literal=gemini-api-key-sw="your-secondary-gemini-key" \
#   --from-literal=openai-key="your-production-openai-key" \
#   --from-literal=mail-username="your-production-email@domain.com" \
#   --from-literal=mail-password="your-production-app-password" \
#   --from-literal=azure-communication-connection-string="your-azure-comm-connection-string" \
#   --from-literal=azure-email-sender="your-azure-sender-email"

# OR apply this file after replacing the base64 values:

apiVersion: v1
kind: Secret
metadata:
  name: sentifinance-secrets
type: Opaque
data:
  # Base64 encoded values (replace these with actual base64 encoded secrets)
  # To encode: echo -n "your-secret" | base64
  
  # REQUIRED SECRETS:
  secret-key: eW91ci1wcm9kdWN0aW9uLXNlY3JldC1rZXk=          # Flask SECRET_KEY - replace with: echo -n "$(openssl rand -hex 32)" | base64
  database-uri: c3FsaXRlOi8vL3Byb2R1Y3Rpb24uZGI=              # DATABASE_URI - replace with production database URI
  jwt-secret-key: eW91ci1wcm9kdWN0aW9uLWp3dC1zZWNyZXQ=         # JWT_SECRET_KEY - replace with: echo -n "$(openssl rand -hex 32)" | base64
  
  # AI API SECRETS:
  gemini-api-key: eW91ci1nZW1pbmktYXBpLWtleQ==                # GEMINI_API_KEY - replace with your production Gemini API key
  gemini-api-key-sw: eW91ci1nZW1pbmktYXBpLWtleS1zdw==          # GEMINI_API_KEY_SW - replace with your secondary Gemini API key
  openai-key: eW91ci1vcGVuYWktYXBpLWtleQ==                    # OPEN_AI_KEY - replace with your OpenAI API key
  
  # EMAIL/COMMUNICATION SECRETS:
  mail-username: eW91ci1lbWFpbEBnbWFpbC5jb20=                  # MAIL_USERNAME - replace with production email
  mail-password: eW91ci1hcHAtcGFzc3dvcmQ=                      # MAIL_PASSWORD - replace with production email app password
  azure-communication-connection-string: eW91ci1henVyZS1jb21tLWNvbm5lY3Rpb24tc3RyaW5n  # AZURE_COMMUNICATION_CONNECTION_STRING
  azure-email-sender: eW91ci1henVyZS1lbWFpbC1zZW5kZXI=         # AZURE_EMAIL_SENDER - DoNotReply email address

---