apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentifinance-hpa
  namespace: sentifinance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentifinance-backend
  minReplicas: 2  # Maintain high availability - never scale below 2 pods
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---