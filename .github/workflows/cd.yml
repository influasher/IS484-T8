name: Deploy to Azure Kubernetes (K8s)

on:
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip Docker build and reuse existing image?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      image_tag:
        description: 'Image tag to use if skipping build (e.g., latest, abc123)'
        required: false
        default: 'latest'
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging
  push:
    branches:
      - dev  # Only deploy from dev branch

permissions:
  contents: read
  packages: write
  security-events: write  # For Trivy results

jobs:
  deploy:
    # Run when pushing to dev OR manual dispatch (removed workflow_run trigger)
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: []
    
    steps:
    - name: Ensure upstream CI succeeded (guard)
      if: ${{ github.event_name == 'workflow_run' }}
      run: |
        echo "Upstream CI workflow conclusion: ${{ github.event.workflow_run.conclusion }}"
        if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
          echo "Upstream CI did not succeed. Aborting CD.";
          exit 1;
        fi
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      with:
        ref: dev  # Explicitly checkout dev branch
        fetch-depth: 0
    
    - name: Azure Login
      uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2.3.0
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Login to Azure Container Registry
      uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef  # v3.6.0
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}
    
    - name: Determine if build is needed
      id: check_build
      run: |
        echo "🔍 Analyzing what needs to be built..."

        # Manual workflow_dispatch can control build behavior
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          if [[ "${{ inputs.skip_build }}" == "true" ]]; then
            echo "skip_build=true" >> $GITHUB_OUTPUT
            echo "skip_news_processor_build=true" >> $GITHUB_OUTPUT
            echo "skip_frontend=true" >> $GITHUB_OUTPUT
            echo "image_tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "⏭️  Manual run: Skipping build, using image tag: ${{ inputs.image_tag }}"
            exit 0
          else
            # Force build when skip_build=false
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "skip_news_processor_build=false" >> $GITHUB_OUTPUT
            echo "skip_frontend=false" >> $GITHUB_OUTPUT
            echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "k8s_changed=0" >> $GITHUB_OUTPUT
            echo "🔨 Manual run: Force building all components"
            exit 0
          fi
        fi

        # Auto-detect changes for push events
        CHANGED_FILES=$(git diff HEAD~1 --name-only || echo "")

        # Count changes (use grep -c which always returns a number, then trim whitespace)
        # Separate backend API changes from news-processor changes
        BACKEND_API_CHANGED=$(echo "$CHANGED_FILES" | grep -E "^Backend/(app|run\.py|Dockerfile|pyproject\.toml|uv\.lock)" | wc -l | tr -d ' ')
        NEWS_PROCESSOR_CHANGED=$(echo "$CHANGED_FILES" | grep -E "^Backend/(jobs|Dockerfile\.news-processor)" | wc -l | tr -d ' ')
        FRONTEND_CHANGED=$(echo "$CHANGED_FILES" | grep -E "^(src/|public/|package\.json|package-lock\.json)" | wc -l | tr -d ' ')
        K8S_CHANGED=$(echo "$CHANGED_FILES" | grep "^k8s/" | wc -l | tr -d ' ')

        # Ensure variables are integers (default to 0 if empty)
        BACKEND_API_CHANGED=${BACKEND_API_CHANGED:-0}
        NEWS_PROCESSOR_CHANGED=${NEWS_PROCESSOR_CHANGED:-0}
        FRONTEND_CHANGED=${FRONTEND_CHANGED:-0}
        K8S_CHANGED=${K8S_CHANGED:-0}

        echo "📊 Change Detection:"
        echo "  Backend API changed: $BACKEND_API_CHANGED files"
        echo "  News Processor changed: $NEWS_PROCESSOR_CHANGED files"
        echo "  Frontend changed: $FRONTEND_CHANGED files"
        echo "  K8s manifests changed: $K8S_CHANGED files"

        # Determine if backend API needs rebuild
        if [[ "$BACKEND_API_CHANGED" -gt 0 ]]; then
          echo "skip_build=false" >> $GITHUB_OUTPUT
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "🔨 Backend API changed - will build new Docker image"
        else
          echo "skip_build=true" >> $GITHUB_OUTPUT
          echo "image_tag=latest" >> $GITHUB_OUTPUT
          echo "⏭️  No Backend API changes - reusing existing :latest image (saves ~3-4 min)"
        fi

        # Determine if news-processor needs rebuild (independent from backend API)
        if [[ "$NEWS_PROCESSOR_CHANGED" -gt 0 ]]; then
          echo "skip_news_processor_build=false" >> $GITHUB_OUTPUT
          echo "🔨 News Processor changed - will build new Docker image (saves ~8-10 min if skipped)"
        else
          echo "skip_news_processor_build=true" >> $GITHUB_OUTPUT
          echo "⏭️  No News Processor changes - reusing existing :latest image (saves ~8-10 min)"
        fi

        # Determine if frontend needs rebuild
        # Note: Frontend must be built whenever backend is built (since it's bundled in the Docker image)
        if [[ "$FRONTEND_CHANGED" -gt 0 ]] || [[ "$BACKEND_API_CHANGED" -gt 0 ]]; then
          echo "skip_frontend=false" >> $GITHUB_OUTPUT
          echo "🔨 Frontend will be built (changed or needed for backend Docker image)"
        else
          echo "skip_frontend=true" >> $GITHUB_OUTPUT
          echo "⏭️  No Frontend or Backend changes - skipping frontend build (saves ~2-3 min)"
        fi

        echo "k8s_changed=$K8S_CHANGED" >> $GITHUB_OUTPUT
    
    - name: Set up Node.js for frontend build
      if: steps.check_build.outputs.skip_frontend == 'false'
      uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Build frontend for production
      if: steps.check_build.outputs.skip_frontend == 'false'
      env:
        REACT_APP_API_BASE_URL: http://${{ secrets.AKS_LOADBALANCER_IP }}
        REACT_APP_ENV: production
      run: |
        echo "🔨 Building frontend..."
        npm ci
        npm run build
    
    - name: Build and push Docker image (Backend)
      if: steps.check_build.outputs.skip_build == 'false'
      run: |
        echo "🔨 Building Docker image for Backend..."
        # Copy frontend build into Backend directory for Docker context
        if [ -d "build" ]; then
          echo "📦 Copying frontend build to Backend/frontend-build..."
          cp -r build Backend/frontend-build
        else
          echo "⚠️  Frontend build not found - backend will serve error page"
          mkdir -p Backend/frontend-build
        fi
        cd Backend
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/sentifinance-backend:${{ github.sha }} .
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/sentifinance-backend:latest .
        echo "📤 Pushing images to ACR..."
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/sentifinance-backend:${{ github.sha }}
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/sentifinance-backend:latest
        echo "✅ Docker build and push complete"
    
    # News Processor build temporarily disabled due to disk space constraints on GitHub Actions
    # The News Processor image is ~1.5GB (Playwright + Chromium + spaCy models)
    # Build separately on a machine with more resources when needed

    # - name: Free up disk space before News Processor build
    #   if: steps.check_build.outputs.skip_news_processor_build == 'false'
    #   run: |
    #     echo "🧹 Cleaning up disk space before large News Processor build..."
    #     docker system prune -af --volumes
    #     df -h

    # - name: Build and push Docker image (News Processor)
    #   if: steps.check_build.outputs.skip_news_processor_build == 'false'
    #   continue-on-error: true
    #   run: |
    #     echo "🔨 Building Docker image for News Processor..."
    #     cd Backend
    #     # Build once and tag twice to save space
    #     docker build -f Dockerfile.news-processor -t ${{ secrets.ACR_LOGIN_SERVER }}/news-processor:${{ github.sha }} .
    #     docker tag ${{ secrets.ACR_LOGIN_SERVER }}/news-processor:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/news-processor:latest
    #     echo "📤 Pushing images to ACR..."
    #     docker push ${{ secrets.ACR_LOGIN_SERVER }}/news-processor:${{ github.sha }}
    #     docker push ${{ secrets.ACR_LOGIN_SERVER }}/news-processor:latest
    #     echo "✅ News Processor Docker build and push complete"
    
    - name: Verify existing image in ACR
      if: steps.check_build.outputs.skip_build == 'true'
      run: |
        echo "✅ Skipping Docker build - verifying existing image..."
        IMAGE_TAG="${{ steps.check_build.outputs.image_tag }}"
        echo "Checking if image exists: ${{ secrets.ACR_LOGIN_SERVER }}/sentifinance-backend:$IMAGE_TAG"
        
        # Try to pull the image to verify it exists
        if docker pull ${{ secrets.ACR_LOGIN_SERVER }}/sentifinance-backend:$IMAGE_TAG; then
          echo "✅ Image verified: $IMAGE_TAG"
        else
          echo "❌ Error: Image not found in ACR"
          echo "Available tags:"
          az acr repository show-tags --name $(echo "${{ secrets.ACR_LOGIN_SERVER }}" | cut -d'.' -f1) \
            --repository sentifinance-backend --orderby time_desc --output table | head -10
          exit 1
        fi
    
    - name: Deploy External Secrets Configuration
      run: |
        # Get AKS credentials
        az aks get-credentials --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }} --overwrite-existing

        # Apply external secrets configuration
        kubectl apply -f k8s/external-secrets.yaml --namespace=sentifinance

        echo "✅ External Secrets configured - secrets will sync from Azure Key Vault"

        # Wait for secret to be created
        echo "Waiting for ExternalSecret to sync..."
        kubectl wait --for=condition=Ready \
          externalsecret/sentifinance-external-secret \
          --namespace=sentifinance \
          --timeout=120s

        # Verify secret exists
        if kubectl get secret sentifinance-secrets --namespace=sentifinance >/dev/null 2>&1; then
          echo "✅ Secret successfully synced from Key Vault"
        else
          echo "❌ Failed to sync secret from Key Vault"
          exit 1
        fi

    - name: Run Database Migrations
      run: |
        echo "============================================"
        echo "Running Pre-Deployment Database Migrations"
        echo "============================================"

        IMAGE_TAG="${{ steps.check_build.outputs.image_tag }}"
        echo "Using image tag: $IMAGE_TAG"

        # Prepare migration job manifest with actual values
        sed -e "s|\${GITHUB_SHA:0:8}|${GITHUB_SHA:0:8}|g" \
            -e "s|\${ACR_LOGIN_SERVER}|${{ secrets.ACR_LOGIN_SERVER }}|g" \
            -e "s|\${IMAGE_TAG}|${IMAGE_TAG}|g" \
            k8s/db-migration-job.yaml > /tmp/db-migration-job.yaml

        echo "Generated migration job manifest:"
        cat /tmp/db-migration-job.yaml

        # Delete old migration jobs (cleanup)
        echo "Cleaning up old migration jobs..."
        kubectl delete job -n sentifinance -l component=migration --ignore-not-found=true

        # Apply migration job
        echo "Creating migration job..."
        kubectl apply -f /tmp/db-migration-job.yaml --namespace=sentifinance

        # Wait for migration to complete
        echo "Waiting for migration to complete (timeout: 10 minutes)..."
        if kubectl wait --for=condition=complete \
            --timeout=600s \
            job/db-migration-${GITHUB_SHA:0:8} \
            --namespace=sentifinance; then
          echo "✅ Migration completed successfully"
        else
          echo "❌ Migration failed or timed out"

          # Show migration logs
          echo ""
          echo "Migration job logs:"
          kubectl logs job/db-migration-${GITHUB_SHA:0:8} --namespace=sentifinance || true

          # Check if job failed
          FAILED_PODS=$(kubectl get pods -n sentifinance -l job-name=db-migration-${GITHUB_SHA:0:8} \
            --field-selector=status.phase=Failed -o name)

          if [ -n "$FAILED_PODS" ]; then
            echo ""
            echo "Failed pod logs:"
            echo "$FAILED_PODS" | xargs -I {} kubectl logs {} -n sentifinance || true
          fi

          echo ""
          echo "❌ DEPLOYMENT ABORTED - Migration must succeed before deploying pods"
          exit 1
        fi

        # Show final migration state
        echo ""
        echo "Final migration logs:"
        kubectl logs job/db-migration-${GITHUB_SHA:0:8} --namespace=sentifinance

        echo ""
        echo "============================================"
        echo "✅ Pre-Deployment Migrations Complete"
        echo "============================================"

    - name: Deploy to AKS (Hybrid Approach)
      run: |
        IMAGE_TAG="${{ steps.check_build.outputs.image_tag }}"
        K8S_CHANGED="${{ steps.check_build.outputs.k8s_changed }}"
        SKIP_BUILD="${{ steps.check_build.outputs.skip_build }}"
        
        echo "🚀 Deploying to AKS"
        echo "  Image tag: $IMAGE_TAG"
        echo "  K8s changed: $K8S_CHANGED files"
        echo "  Skip build: $SKIP_BUILD"
        
        if [[ "$K8S_CHANGED" -gt 0 ]]; then
          echo "🔧 K8s configuration changes detected - applying full manifests"
          for file in k8s/*.yaml; do
            BASENAME="$(basename "$file")"
            # Skip kustomization.yaml and db-migration-job.yaml (migration job is templated and applied separately)
            if [[ "$BASENAME" != "kustomization.yaml" ]] && [[ "$BASENAME" != "db-migration-job.yaml" ]]; then
              echo "Applying $file..."
              kubectl apply -f "$file" --namespace=sentifinance || echo "Warning: failed to apply $file"
            fi
          done

          # Verify PDB is applied
          echo "Verifying PodDisruptionBudget..."
          kubectl get pdb -n sentifinance || echo "No PDB found"
        elif [[ "$SKIP_BUILD" == "false" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "⚡ Code or manual deployment - using fast image update"
          kubectl set image deployment/sentifinance-backend \
            sentifinance-backend=${{ secrets.ACR_LOGIN_SERVER }}/sentifinance-backend:$IMAGE_TAG \
            --namespace=sentifinance \
            || echo "Deployment not found, falling back to full apply..."
          
          # Update News Processor CronJob image
          echo "⚡ Updating News Processor CronJob image..."
          kubectl set image cronjob/news-processor \
            news-processor=${{ secrets.ACR_LOGIN_SERVER }}/news-processor:$IMAGE_TAG \
            --namespace=sentifinance \
            || echo "CronJob not found, will be created with full apply"
          
          # Fallback: If deployment doesn't exist, apply manifests
          if ! kubectl get deployment sentifinance-backend --namespace=sentifinance > /dev/null 2>&1; then
            echo "📦 Deployment not found - applying manifests for first-time setup"
            for file in k8s/*.yaml; do
              BASENAME="$(basename "$file")"
              # Skip kustomization.yaml and db-migration-job.yaml (migration job is templated and applied separately)
              if [[ "$BASENAME" != "kustomization.yaml" ]] && [[ "$BASENAME" != "db-migration-job.yaml" ]]; then
                kubectl apply -f "$file" --namespace=sentifinance || echo "Warning: failed to apply $file"
              fi
            done
          fi
        else
          echo "❓ No relevant changes detected - applying full manifests to be safe"
          for file in k8s/*.yaml; do
            BASENAME="$(basename "$file")"
            # Skip kustomization.yaml and db-migration-job.yaml (migration job is templated and applied separately)
            if [[ "$BASENAME" != "kustomization.yaml" ]] && [[ "$BASENAME" != "db-migration-job.yaml" ]]; then
              kubectl apply -f "$file" --namespace=sentifinance || echo "Warning: failed to apply $file"
            fi
          done
        fi
    
    - name: Comprehensive Deployment Validation
      id: smoke_tests
      run: |
        echo "============================================"
        echo "Deployment Validation & Smoke Tests"
        echo "============================================"

        # Step 1: Wait for rollout to complete
        echo "Step 1: Waiting for deployment rollout..."
        if ! kubectl rollout status deployment/sentifinance-backend \
            --namespace=sentifinance \
            --timeout=300s; then
          echo "❌ Deployment rollout failed"
          exit 1
        fi
        echo "✅ Rollout completed"

        # Step 2: Verify pods are running
        echo ""
        echo "Step 2: Checking pod status..."
        READY_PODS=$(kubectl get pods -n sentifinance -l app=sentifinance-backend \
          -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' | wc -w)
        TOTAL_PODS=$(kubectl get pods -n sentifinance -l app=sentifinance-backend \
          --no-headers | wc -l)

        echo "Ready pods: $READY_PODS / $TOTAL_PODS"

        if [ "$READY_PODS" -eq 0 ]; then
          echo "❌ No pods are running"
          kubectl get pods -n sentifinance -l app=sentifinance-backend
          exit 1
        fi
        echo "✅ Pods are running"

        # Step 3: Get service endpoint
        echo ""
        echo "Step 3: Getting service endpoint..."
        SERVICE_IP=$(kubectl get service sentifinance-service \
          --namespace=sentifinance \
          -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

        if [ -z "$SERVICE_IP" ] || [ "$SERVICE_IP" == "null" ]; then
          echo "❌ LoadBalancer IP not available"
          kubectl describe service sentifinance-service --namespace=sentifinance
          exit 1
        fi

        APP_URL="http://$SERVICE_IP"
        echo "✅ App URL: $APP_URL"

        # Step 4: Wait for service to be ready (pods might be running but not ready)
        echo ""
        echo "Step 4: Waiting for service to respond..."
        for i in {1..30}; do
          if curl -f --max-time 10 "$APP_URL/" >/dev/null 2>&1; then
            echo "✅ Service is responding"
            break
          fi
          echo "Attempt $i/30: Service not ready yet..."
          sleep 5
        done

        # Step 5: Test root endpoint
        echo ""
        echo "Step 5: Testing root endpoint (/)..."
        if ! curl -f --max-time 30 "$APP_URL/" > /tmp/root_response.txt 2>&1; then
          echo "❌ Root endpoint test failed"
          cat /tmp/root_response.txt
          exit 1
        fi
        echo "✅ Root endpoint responding"

        # Step 6: Test API health endpoint
        echo ""
        echo "Step 6: Testing API health endpoint (/api)..."
        if ! HEALTH_RESPONSE=$(curl -f --max-time 30 "$APP_URL/api" 2>/dev/null); then
          echo "❌ API health endpoint test failed"
          exit 1
        fi
        echo "API Response: $HEALTH_RESPONSE"
        echo "✅ API health endpoint responding"

        # Step 7: Test database connectivity (via entities endpoint)
        echo ""
        echo "Step 7: Testing database connectivity (/api/entities)..."
        if ! curl -f --max-time 30 "$APP_URL/api/entities" >/dev/null 2>&1; then
          echo "❌ Database connectivity test failed (entities endpoint)"
          # Non-fatal - might be empty table
          echo "⚠️  Warning: Entities endpoint failed, but continuing"
        else
          echo "✅ Database connectivity confirmed"
        fi

        # Step 8: Check application logs for errors
        echo ""
        echo "Step 8: Checking application logs for errors..."
        RECENT_LOGS=$(kubectl logs -n sentifinance -l app=sentifinance-backend \
          --tail=100 --since=2m 2>/dev/null || echo "")

        ERROR_COUNT=$(echo "$RECENT_LOGS" | grep -i "error\|exception\|traceback" | wc -l)

        if [ "$ERROR_COUNT" -gt 0 ]; then
          echo "⚠️  Found $ERROR_COUNT error/exception log lines:"
          echo "$RECENT_LOGS" | grep -i "error\|exception\|traceback" | head -20
          echo ""
          echo "⚠️  Errors detected but not failing deployment (check logs)"
        else
          echo "✅ No errors found in recent logs"
        fi

        # Step 9: Verify deployment revision
        echo ""
        echo "Step 9: Verifying deployment revision..."
        CURRENT_REVISION=$(kubectl get deployment sentifinance-backend -n sentifinance \
          -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')
        echo "Current deployment revision: $CURRENT_REVISION"
        echo "✅ Deployment revision recorded"

        echo ""
        echo "============================================"
        echo "✅ All smoke tests passed!"
        echo "Deployment: SUCCESSFUL"
        echo "App URL: $APP_URL"
        echo "============================================"

    - name: Deployment Summary
      if: always()
      run: |
        echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.smoke_tests.outcome }}" == "success" ]; then
          echo "✅ **Status:** Deployment Successful" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Status:** Deployment Failed" >> $GITHUB_STEP_SUMMARY
        fi
        echo "- **Environment:** Production (AKS)" >> $GITHUB_STEP_SUMMARY
        echo "- **Version:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

        SERVICE_IP=$(kubectl get service sentifinance-service -n sentifinance -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "N/A")
        if [ "$SERVICE_IP" != "N/A" ]; then
          echo "- **App URL:** http://$SERVICE_IP" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Rollback on Failure
      if: failure() && steps.smoke_tests.outcome == 'failure'
      run: |
        echo "============================================"
        echo "❌ DEPLOYMENT FAILED - Initiating Rollback"
        echo "============================================"

        # Get previous revision
        CURRENT_REVISION=$(kubectl get deployment sentifinance-backend -n sentifinance \
          -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')
        echo "Current (failed) revision: $CURRENT_REVISION"

        # Rollback to previous version
        echo "Rolling back to previous revision..."
        kubectl rollout undo deployment/sentifinance-backend --namespace=sentifinance

        # Wait for rollback to complete
        echo "Waiting for rollback to complete..."
        kubectl rollout status deployment/sentifinance-backend \
          --namespace=sentifinance \
          --timeout=300s

        # Verify rollback
        NEW_REVISION=$(kubectl get deployment sentifinance-backend -n sentifinance \
          -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')
        echo "Rolled back to revision: $NEW_REVISION"

        # Quick health check
        SERVICE_IP=$(kubectl get service sentifinance-service -n sentifinance \
          -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        APP_URL="http://$SERVICE_IP"

        echo "Testing rolled-back version..."
        sleep 10  # Give it a moment

        if curl -f --max-time 30 "$APP_URL/" >/dev/null 2>&1; then
          echo "✅ Rollback successful - application responding"
        else
          echo "❌ Rollback completed but application not responding"
          echo "Manual intervention required!"
        fi

        echo ""
        echo "============================================"
        echo "Rollback Complete"
        echo "Failed deployment SHA: ${{ github.sha }}"
        echo "Please investigate logs and fix issues"
        echo "============================================"

        # Exit with error to fail the workflow
        exit 1