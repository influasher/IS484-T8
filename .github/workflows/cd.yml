name: Deploy to Azure Kubernetes (K8s)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging
  workflow_run:
    workflows:
      - "Basic CI Pipeline"
    types:
      - completed
  push:
    branches:
      - dev

jobs:
  deploy:
    # Run when triggered by a successful upstream CI workflow_run OR when pushing to dev
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-latest
    needs: []
    
    steps:
    - name: Ensure upstream CI succeeded (guard)
      if: ${{ github.event_name == 'workflow_run' }}
      run: |
        echo "Upstream CI workflow conclusion: ${{ github.event.workflow_run.conclusion }}"
        if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
          echo "Upstream CI did not succeed. Aborting CD.";
          exit 1;
        fi
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Login to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}
    
    - name: Set up Node.js for frontend build
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Build frontend for production
      env:
        REACT_APP_API_BASE_URL: http://${{ secrets.AKS_LOADBALANCER_IP }}
        REACT_APP_ENV: production
      run: |
        npm ci
        npm run build
    
    - name: Build and push Docker image
      run: |
        cd Backend
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/sentifinance-backend:${{ github.sha }} .
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/sentifinance-backend:latest .
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/sentifinance-backend:${{ github.sha }}
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/sentifinance-backend:latest
    
    - name: Create Kubernetes secrets from GitHub Actions
      run: |
        # Get AKS credentials
        az aks get-credentials --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }} --overwrite-existing
        
        # Create or update secrets from GitHub Actions secrets
        kubectl create secret generic sentifinance-secrets \
          --from-literal=secret-key="${{ secrets.SECRET_KEY }}" \
          --from-literal=database-uri="${{ secrets.DATABASE_URI }}" \
          --from-literal=jwt-secret-key="${{ secrets.JWT_SECRET_KEY }}" \
          --from-literal=gemini-api-key="${{ secrets.GEMINI_API_KEY }}" \
          --from-literal=gemini-api-key-sw="${{ secrets.GEMINI_API_KEY_SW }}" \
          --from-literal=openai-key="${{ secrets.OPEN_AI_KEY }}" \
          --from-literal=mail-username="${{ secrets.MAIL_USERNAME }}" \
          --from-literal=mail-password="${{ secrets.MAIL_PASSWORD }}" \
          --from-literal=azure-communication-connection-string="${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}" \
          --from-literal=azure-email-sender="${{ secrets.AZURE_EMAIL_SENDER }}" \
          --namespace=sentifinance --dry-run=client -o yaml | kubectl apply -f -
    
    - name: Deploy to AKS (Hybrid Approach)
      run: |
        
        # Detect what changed in this commit
        CHANGED_FILES=$(git diff HEAD~1 --name-only)
        echo "Changed files: $CHANGED_FILES"
        
        # Check if any k8s configuration files changed
        K8S_CHANGED=$(echo "$CHANGED_FILES" | grep -c "^k8s/" || echo "0")
        
        # Check for application code changes (expanded patterns)
        CODE_CHANGED=$(echo "$CHANGED_FILES" | grep -c -E "^(Backend|src|public|package\.json|package-lock\.json|requirements\.txt|.*Dockerfile.*|pyproject\.toml|uv\.lock)" || echo "0")
        
        echo "K8s files changed: $K8S_CHANGED"
        echo "Code files changed: $CODE_CHANGED"
        
        if [ "$K8S_CHANGED" -gt 0 ]; then
          echo "🔧 K8s configuration changes detected - applying full manifests for safety"
          # Apply manifests individually to skip kustomization.yaml (not a k8s resource)
          for file in k8s/*.yaml; do
            if [[ "$(basename "$file")" != "kustomization.yaml" ]]; then
              echo "Applying $file..."
              kubectl apply -f "$file" --namespace=sentifinance || echo "Warning: failed to apply $file"
            fi
          done
        elif [ "$CODE_CHANGED" -gt 0 ]; then
          echo "⚡ Only code changes detected - using fast image update"
          kubectl set image deployment/sentifinance-backend \
            sentifinance-backend=${{ secrets.ACR_LOGIN_SERVER }}/sentifinance-backend:${{ github.sha }} \
            --namespace=sentifinance \
            || echo "Deployment not found, falling back to full apply..."
          
          # Fallback: If deployment doesn't exist, apply manifests
          if ! kubectl get deployment sentifinance-backend --namespace=sentifinance > /dev/null 2>&1; then
            echo "📦 Deployment not found - applying manifests for first-time setup"
            for file in k8s/*.yaml; do
              if [[ "$(basename "$file")" != "kustomization.yaml" ]]; then
                kubectl apply -f "$file" --namespace=sentifinance || echo "Warning: failed to apply $file"
              fi
            done
          fi
        else
          echo "❓ No relevant changes detected - applying full manifests to be safe"
          for file in k8s/*.yaml; do
            if [[ "$(basename "$file")" != "kustomization.yaml" ]]; then
              kubectl apply -f "$file" --namespace=sentifinance || echo "Warning: failed to apply $file"
            fi
          done
        fi
    
    - name: Health Check
      run: |
        echo "Waiting for deployment to be ready..."
        kubectl rollout status deployment/sentifinance-backend --namespace=sentifinance --timeout=300s
        
        # Get service URL (adjust based on your service type)
        SERVICE_IP=$(kubectl get service sentifinance-service --namespace=sentifinance -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "pending")
        
        if [ "$SERVICE_IP" != "pending" ] && [ "$SERVICE_IP" != "" ]; then
          APP_URL="http://$SERVICE_IP"
          echo "✅ App should be available at: $APP_URL"
          
          # Health check with retry
          for i in {1..5}; do
            echo "Health check attempt $i..."
            if curl -f --max-time 30 "$APP_URL/" > /dev/null 2>&1; then
              echo "✅ Health check passed! App is running at $APP_URL"
              break
            else
              echo "❌ Health check failed, retrying in 10 seconds..."
              sleep 10
            fi
          done
        else
          echo "⏳ LoadBalancer IP still pending, check kubectl get services"
        fi