name: Deploy to Azure Kubernetes (K8s)

# This file contains the original Kubernetes deployment configuration
# It's preserved for future use when AKS becomes available
# To use this configuration:
# 1. Rename this file back to cd.yml
# 2. Ensure you have AKS cluster and required secrets configured
# 3. Create k8s/ directory with your Kubernetes manifests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Login to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}
    
    - name: Set up Node.js for frontend build
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Build frontend for production
      env:
        REACT_APP_API_BASE_URL: http://${{ secrets.AKS_LOADBALANCER_IP }}
        REACT_APP_ENV: production
      run: |
        npm ci
        npm run build
    
    - name: Build and push Docker image
      run: |
        cd Backend
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/sentifinance-backend:${{ github.sha }} .
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/sentifinance-backend:latest .
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/sentifinance-backend:${{ github.sha }}
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/sentifinance-backend:latest
    
    - name: Deploy to AKS
      run: |
        # Get AKS credentials
        az aks get-credentials --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }} --overwrite-existing
        
        # Deploy using kubectl (assumes you have K8s manifests)
        kubectl set image deployment/sentifinance-backend sentifinance-backend=${{ secrets.ACR_LOGIN_SERVER }}/sentifinance-backend:${{ github.sha }} || echo "Deployment not found, applying manifests..."
        
        # Apply K8s manifests if they exist
        if [ -d "k8s" ]; then
          kubectl apply -f k8s/
        fi
    
    - name: Health Check
      run: |
        echo "Waiting for deployment to be ready..."
        kubectl rollout status deployment/sentifinance-backend --timeout=300s
        
        # Get service URL (adjust based on your service type)
        SERVICE_IP=$(kubectl get service sentifinance-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "pending")
        
        if [ "$SERVICE_IP" != "pending" ] && [ "$SERVICE_IP" != "" ]; then
          APP_URL="http://$SERVICE_IP"
          echo "✅ App should be available at: $APP_URL"
          
          # Health check with retry
          for i in {1..5}; do
            echo "Health check attempt $i..."
            if curl -f --max-time 30 "$APP_URL/" > /dev/null 2>&1; then
              echo "✅ Health check passed! App is running at $APP_URL"
              break
            else
              echo "❌ Health check failed, retrying in 10 seconds..."
              sleep 10
            fi
          done
        else
          echo "⏳ LoadBalancer IP still pending, check kubectl get services"
        fi