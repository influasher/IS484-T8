name: Basic CI Pipeline

on:
  push:
    branches: [ dev ]  # Only run CI on dev branch

permissions:
  contents: read
  packages: write
  security-events: write  # For Trivy results

jobs:
  # Backend Job
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URI: postgresql://test_user:test_password@localhost:5432/test_db
      SECRET_KEY: test-secret-key-for-ci
      JWT_SECRET_KEY: test-jwt-secret-for-ci
      
    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
    
    - name: Set up Python and UV
      uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3  # v7.1.3
      with:
        version: "latest"
        enable-cache: true
    
    - name: Install backend dependencies
      run: |
        cd Backend
        uv sync

    - name: Wait for Postgres to be ready
      run: |
        until pg_isready -h localhost -p 5432 -U test_user; do
          echo "Waiting for Postgres..."
          sleep 2
        done
    
    - name: Run backend tests
      run: |
        cd Backend
        uv run python -m tests.run_tests

  # Frontend Job
  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
    
    - name: Set up Node.js
      uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install frontend dependencies
      run: npm ci
    
    - name: Run frontend tests with coverage
      env:
        REACT_APP_API_BASE_URL: http://localhost:5001
        REACT_APP_ENV: testing
      run: npm test -- --watchAll=false --passWithNoTests --coverage --coverageReporters=html --coverageReporters=text

    - name: Upload frontend coverage report
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
      if: always()
      with:
        name: frontend-coverage-report
        path: coverage/
        retention-days: 7

    - name: Build frontend
      env:
        REACT_APP_API_BASE_URL: http://localhost:5001
        REACT_APP_ENV: testing
      run: npm run build
    
    - name: Verify build output
      run: |
        ls -la build/
        echo "Frontend build completed successfully"

  # Code Quality Check
  code-quality:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
    
    - name: Set up Python and UV
      uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3  # v7.1.3
      with:
        version: "latest"
        enable-cache: true
    
    - name: Install Python linters
      run: |
        cd Backend
        uv sync  # This will install dev dependencies from pyproject.toml
    
    - name: Check Python code formatting
      run: |
        cd Backend
        uv run black --check . || echo "Run 'black .' to fix formatting"
    
    - name: Check Python code style
      run: |
        cd Backend
        uv run flake8 . --max-line-length=88 --exclude=venv,migrations,.venv || echo "Fix flake8 issues"