name: Basic CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  # Backend Job
  backend-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python and UV
      uses: astral-sh/setup-uv@v3
      with:
        python-version: "3.11"
    
    - name: Install backend dependencies
      run: |
        cd Backend
        uv sync
    
    - name: Run backend tests
      run: |
        cd Backend
        uv run pytest dummy_tests/ --verbose
    
    - name: Test Flask app startup
      run: |
        cd Backend
        uv run python -c "from app import create_app; app = create_app(); print('Flask app created successfully')"

  # Frontend Job
  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install frontend dependencies
      run: npm ci
    
    - name: Run frontend tests
      run: npm test -- --watchAll=false --passWithNoTests
    
    - name: Build frontend
      run: npm run build
    
    - name: Verify build output
      run: |
        ls -la build/
        echo "Frontend build completed successfully"

  # Code Quality Check
  code-quality:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python and UV
      uses: astral-sh/setup-uv@v3
      with:
        python-version: "3.11"
    
    - name: Install Python linters
      run: |
        cd Backend
        uv add --dev black flake8
    
    - name: Check Python code formatting
      run: |
        cd Backend
        uv run black --check . || echo "Run 'black .' to fix formatting"
    
    - name: Check Python code style
      run: |
        cd Backend
        uv run flake8 . --max-line-length=88 --exclude=venv,migrations || echo "Fix flake8 issues"