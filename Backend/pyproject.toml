[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pip",
    "azure-communication-email>=1.0.0",
    "coverage==7.6.9",
    "crawl4ai==0.4.248",
    "fake-useragent>=2.2.0",
    "finvizfinance>=1.1.1",
    "flask==3.1.0",
    "flask-cors==5.0.0",
    "flask-jwt-extended==4.7.1",
    "flask-mail>=0.10.0",
    "flask-migrate==4.0.7",
    "flask-sqlalchemy==3.1.1",
    "flask-testing==0.8.1",
    "fpdf>=1.7.2",
    "gnews==0.3.9",
    "google-generativeai>=0.8.5",
    "googlenewsdecoder==0.1.6",
    "lxml-html-clean>=0.4.2",
    "lxml[html-clean]>=5.4.0",
    "matplotlib>=3.10.6",
    "newspaper4k>=0.9.3.1",
    "nltk==3.9.1",
    "numpy>=1.26.0,<2.3.2",
    "pandas>=2.3.2",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.0.1",
    "rapidfuzz>=3.14.0",
    "requests==2.32.3",
    "requests-cache>=1.2.1",
    "spacy>=3.8.7",
    "spacy-curated-transformers>=0.3.1",
    "spacy-transformers>=1.3.9",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "torchvision>=0.23.0",
    "transformers==4.47.0",
    "validators==0.34.0",
    "yfinance[nospam]>=0.2.65",
    "en-core-web-trf @ https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-flask==1.3.0",
    "coverage==7.6.9",
    "black>=22.0.0",
    "flake8>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
